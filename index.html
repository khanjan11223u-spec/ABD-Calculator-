<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABD Calculator</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #e8e8e8; /* Neumorphism Light Background */
        }

        .calculator {
            background: #e8e8e8;
            padding: 20px;
            border-radius: 30px;
            box-shadow: 
                20px 20px 60px #c5c5c5,
                -20px -20px 60px #ffffff;
        }

        .display {
            width: 100%;
            height: 80px;
            background: #e8e8e8;
            border: none;
            outline: none;
            text-align: right;
            font-size: 36px;
            font-weight: 600;
            color: #333;
            padding: 10px 20px;
            border-radius: 15px;
            box-shadow: 
                inset 5px 5px 10px #c5c5c5,
                inset -5px -5px 10px #ffffff;
            margin-bottom: 20px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 70px);
            gap: 15px;
            justify-content: center;
        }

        button {
            width: 70px;
            height: 70px;
            border: none;
            outline: none;
            border-radius: 50%;
            background: #e8e8e8;
            font-size: 20px;
            font-weight: 500;
            color: #333;
            cursor: pointer;
            box-shadow: 
                5px 5px 10px #c5c5c5,
                -5px -5px 10px #ffffff;
            transition: 0.1s;
        }

        button:active {
            box-shadow: 
                inset 5px 5px 10px #c5c5c5,
                inset -5px -5px 10px #ffffff;
            transform: scale(0.95);
        }

        .operator {
            color: #ff6b6b; /* Soft Red for operators */
        }

        .equal {
            background: #ff6b6b;
            color: #fff;
            box-shadow: 
                5px 5px 10px #d45a5a,
                -5px -5px 10px #ff7c7c;
        }

        .equal:active {
            box-shadow: 
                inset 5px 5px 10px #d45a5a,
                inset -5px -5px 10px #ff7c7c;
        }
    </style>
</head>
<body>

    <!-- Click Sound Audio -->
    <audio id="clickSound" src="https://assets.mixkit.co/sfx/preview/mixkit-modern-technology-select-3124.mp3"></audio>

    <div class="calculator">
        <input type="text" class="display" id="display" readonly>
        <div class="buttons">
            <button onclick="clearDisplay()">C</button>
            <button onclick="deleteLast()">DEL</button>
            <button onclick="appendValue('%')">%</button>
            <button class="operator" onclick="appendValue('/')">÷</button>

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="operator" onclick="appendValue('*')">×</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button class="operator" onclick="appendValue('-')">-</button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button class="operator" onclick="appendValue('+')">+</button>

            <button onclick="appendValue('0')" style="grid-column: span 2; width: 155px; border-radius: 35px;">0</button>
            <button onclick="appendValue('.')">.</button>
            <button class="equal" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');

        // Sound Function
        function playSound() {
            let sound = document.getElementById('clickSound');
            sound.currentTime = 0; // Restart sound
            sound.play();
        }

        function appendValue(val) {
            playSound();
            display.value += val;
        }

        function clearDisplay() {
            playSound();
            display.value = '';
        }

        function deleteLast() {
            playSound();
            display.value = display.value.slice(0, -1);
        }

        function calculate() {
            playSound();
            try {
                display.value = eval(display.value);
            } catch (e) {
                display.value = 'Error';
            }
        }
    </script>
</body>
  </html>
